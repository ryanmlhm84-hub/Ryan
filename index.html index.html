<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RYAN Creative — Creativity Meets Technology</title>
<meta name="description" content="RYAN Creative: creative media designer portfolio — game design, animation, web design, UI/UX and graphic design. | ريان: مصمم وسائط إبداعية.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#090B12;--bg2:#111827;--ac:#7895FF;--tx:#fff;--mu:#A1A1AA;--bd:#252B38;--f:'Inter','Cairo',system-ui,sans-serif;color-scheme:dark}
[dir=rtl]{--f:'Cairo','Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:80px}
body{background:var(--bg);color:var(--tx);font:400 16px/1.7 var(--f);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%;display:block}a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.w{max-width:1120px;margin:auto;padding:0 24px}section{padding:96px 0}
h1,h2,h3{line-height:1.2;font-weight:800}h2{font-size:clamp(28px,4vw,42px);margin-bottom:12px}
.eyebrow{color:var(--ac);font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;margin-bottom:12px}
.mu{color:var(--mu)}
header{position:sticky;top:0;z-index:20;background:rgba(9,11,18,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
nav{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}.brand img{width:34px;height:34px;border-radius:8px}.brand i{color:var(--ac);font-style:normal}
.links{display:flex;gap:28px;font-size:15px;color:var(--mu)}.links a:hover{color:var(--tx)}
.tools{display:flex;gap:10px;align-items:center}
.btn{display:inline-block;padding:12px 24px;border-radius:10px;font:600 15px var(--f);border:1px solid var(--bd);background:none;color:var(--tx);cursor:pointer;transition:.2s}
.btn.p{background:var(--ac);border-color:var(--ac);color:#090B12}.btn:hover{transform:translateY(-2px);border-color:var(--ac)}
.lang{padding:6px 14px;font-size:13px}
.burger{display:none;padding:8px 12px}
.hero{padding:80px 0 96px}.hero .w{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(38px,6vw,64px);margin-bottom:12px}.hero h1+p.ar{color:var(--ac);font-size:24px;font-weight:700;margin-bottom:16px}
.hero p.d{color:var(--mu);max-width:520px;margin-bottom:32px}.row{display:flex;gap:12px;flex-wrap:wrap}
.vis{border-radius:20px;border:1px solid var(--bd);overflow:hidden;background:var(--bg2);box-shadow:0 20px 60px rgba(0,0,0,.5)}.vis img{width:100%;aspect-ratio:1;object-fit:cover}
.badge{display:inline-block;border:1px solid var(--bd);background:var(--bg2);color:var(--ac);padding:4px 14px;border-radius:99px;font-size:13px;margin-bottom:20px}
.alt{background:var(--bg2);border-block:1px solid var(--bd)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}.two img{border-radius:16px;border:1px solid var(--bd);width:100%;aspect-ratio:4/3;object-fit:cover}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.tag{border:1px solid var(--bd);border-radius:99px;padding:4px 14px;font-size:14px;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:40px}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:16px;padding:24px;transition:.25s}.card:hover{border-color:var(--ac);transform:translateY(-4px)}
.card svg{width:30px;height:30px;stroke:var(--ac);fill:none;stroke-width:1.6;margin-bottom:16px}.card h3{font-size:17px;margin-bottom:8px}.card p{color:var(--mu);font-size:14px;line-height:1.6}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}.filters button{padding:6px 18px;border-radius:99px;font-size:14px}.filters .on{background:var(--ac);color:#090B12;border-color:var(--ac)}
.proj{padding:0;overflow:hidden;cursor:pointer;text-align:start;color:inherit;font-family:inherit;width:100%}.proj img{width:100%;aspect-ratio:16/10;object-fit:cover}.proj div{padding:20px}.proj small{color:var(--ac)}.proj span{display:block;margin-top:12px;font-size:14px;font-weight:600}
#pg{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:48px;position:relative}
.step{border-top:2px solid var(--bd);padding-top:20px}.step b{color:var(--ac);font-size:14px}.step h3{margin:6px 0}.step p{color:var(--mu);font-size:14px}
.tools2{display:flex;flex-wrap:wrap;gap:10px;margin-top:32px}.tools2 span{background:var(--bg2);border:1px solid var(--bd);padding:8px 18px;border-radius:10px;font-size:14px}
form{display:grid;gap:16px;margin-top:32px}label{font-size:14px;color:var(--mu);display:grid;gap:6px}
input,select,textarea{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;color:var(--tx);padding:12px 14px;font:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac)}[aria-invalid=true]{border-color:#f87171}
#msg{font-size:14px;min-height:22px;color:var(--mu)}.soc{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.soc a{border:1px solid var(--bd);padding:8px 18px;border-radius:99px;font-size:14px;color:var(--mu)}.soc a:hover{color:var(--tx);border-color:var(--ac)}
footer{border-top:1px solid var(--bd);padding:40px 0;color:var(--mu);font-size:14px}footer .w{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
dialog{background:var(--bg2);color:var(--tx);border:1px solid var(--bd);border-radius:20px;max-width:640px;width:calc(100% - 32px);padding:0;margin:auto}dialog::backdrop{background:rgba(0,0,0,.7)}
dialog img{width:100%;aspect-ratio:16/9;object-fit:cover}dialog .b{padding:28px}dialog h3{font-size:24px;margin:6px 0 12px}dialog p{margin-bottom:12px;color:var(--mu)}
@media(max-width:820px){.links{display:none;position:absolute;top:68px;inset-inline:0;background:var(--bg);flex-direction:column;padding:20px 24px;border-bottom:1px solid var(--bd)}.links.open{display:flex}.burger{display:block}
.hero .w,.two{grid-template-columns:1fr}.steps{grid-template-columns:1fr}.step{border-top:0;border-inline-start:2px solid var(--bd);padding:0 20px}section{padding:64px 0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<h2 data-en="Behind The Creativity." data-ar="خلف الإبداع"></h2>
<p class="mu" data-en="I'm Ryan Mahmoud Tawfiq Melhem, a creative media designer who enjoys combining technology, imagination, and visual storytelling. I'm interested in game design, animation, web design, and interactive experiences, and I keep exploring new tools and techniques to turn ideas into distinctive digital projects." data-ar="أنا ريان محمود توفيق ملحم، مصمم وسائط إبداعية أستمتع بالجمع بين التكنولوجيا والخيال والسرد البصري. أهتم بتصميم الألعاب والرسوم المتحركة وتصميم المواقع والتجارب التفاعلية، وأواصل استكشاف أدوات وتقنيات جديدة لتحويل الأفكار إلى مشاريع رقمية مميزة."></p>

const g=o=>typeof o==="string"?o:o[L];
function render(){
 document.documentElement.lang=L;document.documentElement.dir=L==="ar"?"rtl":"ltr";
 document.querySelectorAll("[data-en]").forEach(e=>e.textContent=e.dataset[L]);
 $("#tags").innerHTML=["game","anim","web","ui","gfx","vid"].map((k,i)=>`<span class="tag">${[{en:"Game Design",ar:"تصميم الألعاب"},{en:"Animation",ar:"الرسوم المتحركة"},{en:"Web Design",ar:"تصميم المواقع"},{en:"UI/UX",ar:"UI/UX"},{en:"Graphic Design",ar:"التصميم الجرافيكي"},{en:"Video Editing",ar:"تحرير الفيديو"}][i][L]}</span>`).join("");
 $("#sv").innerHTML=SERVICES.map(s=>`<article class="card"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${s[0]}"/></svg><h3>${g(s[1])}</h3><p>${g(s[2])}</p></article>`).join("");
 const all={all:{en:"All",ar:"الكل"},...CATS};
 $("#ft").innerHTML=Object.keys(all).map(k=>`<button class="btn ${k===flt?"on":""}" data-k="${k}" aria-pressed="${k===flt}">${all[k][L]}</button>`).join("");
 $("#pg").innerHTML=PROJECTS.map((p,i)=>({p,i})).filter(o=>flt==="all"||o.p.c===flt).map(({p,i})=>`<button class="card proj" data-i="${i}"><img src="${p.img}" alt="" loading="lazy"><div><small>${CATS[p.c][L]}</small><h3>${g(p.t)}</h3><p>${g(p.d)}</p><span>${L==="ar"?"عرض المشروع ←":"View Project →"}</span></div></button>`).join("");
 $("#st").innerHTML=STEPS.map((s,i)=>`<div class="step"><b>0${i+1}</b><h3>${g(s[0])}</h3><p>${g(s[1])}</p></div>`).join("");
 $("#sk").innerHTML=SKILLS.map(s=>`<span contenteditable="false">${g(s)}</span>`).join("");
 const o=Object.values(CATS).map(c=>c[L]).concat(L==="ar"?["أخرى"]:["Other"]);$("#pt").innerHTML=o.map(x=>`<option>${x}</option>`).join("");
 $("#so").innerHTML=SOCIAL.map(s=>`<a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a>`).join("");
 $("#yr").textContent=new Date().getFullYear();
}
$("#lang").onclick=()=>{L=L==="en"?"ar":"en";try{localStorage.setItem("lang",L)}catch(e){}render()};
$("#bg").onclick=()=>{const o=$("#links").classList.toggle("open");$("#bg").setAttribute("aria-expanded",o)};
$("#links").onclick=()=>$("#links").classList.remove("open");
$("#ft").onclick=e=>{if(e.target.dataset.k){flt=e.target.dataset.k;render()}};
$("#pg").onclick=e=>{const b=e.target.closest(".proj");if(!b)return;const p=PROJECTS[b.dataset.i];
 $("#di").src=p.img;$("#dc").textContent=CATS[p.c][L];$("#dt").textContent=g(p.t);$("#dd").textContent=g(p.d);$("#dx").textContent=g(p.x);
 $("#dl").textContent=(L==="ar"?"الأدوات: ":"Tools: ")+p.tools;$("#dg").showModal()};
$("#dz").onclick=()=>$("#dg").close();
$("#f").onsubmit=e=>{e.preventDefault();const f=e.target,m=$("#msg");let ok=true;
 [f.n,f.e,f.m].forEach(i=>{const v=i.value.trim()&&(i!==f.e||/^\S+@\S+\.\S+$/.test(i.value));i.setAttribute("aria-invalid",!v);if(!v)ok=false});
 if(!ok){m.textContent=L==="ar"?"يرجى تعبئة الحقول بشكل صحيح.":"Please fill in the fields correctly.";return}
 if(!FORM_ENDPOINT){m.textContent=L==="ar"?"النموذج غير مفعّل بعد: يلزم ضبط خدمة استقبال الرسائل (FORM_ENDPOINT). لم يتم إرسال أي رسالة.":"The form isn't set up yet: a submission service (FORM_ENDPOINT) must be configured. No message was sent.";return}
 fetch(FORM_ENDPOINT,{method:"POST",headers:{Accept:"application/json"},body:new FormData(f)}).then(r=>{m.textContent=r.ok?(L==="ar"?"تم الإرسال، شكراً!":"Sent, thank you!"):(L==="ar"?"فشل الإرسال.":"Sending failed.");if(r.ok)f.reset()}).catch(()=>m.textContent=L==="ar"?"فشل الإرسال.":"Sending failed.")};
render();
</script>
</body></html>
